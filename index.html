<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="拼豆图纸">
  <title>拼豆图纸生成器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>拼豆图纸生成器</h1>
    <span class="subtitle">上传图片 → 框选区域 → 生成图纸</span>
  </header>

  <main class="main">

    <!-- ====== 上传区 ====== -->
    <section class="upload-section" id="uploadSection">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      <!-- 桌面端：拖拽上传区 -->
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">
          <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="upload-text">拖拽图片到此处，或 <strong>点击上传</strong></p>
        <p class="upload-hint">支持 JPG / PNG / WebP，最大 20MB</p>
      </div>
      <!-- 手机端：双按钮 -->
      <div class="upload-buttons" id="uploadButtons">
        <button class="upload-btn" id="galleryBtn">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span>相册</span>
        </button>
        <button class="upload-btn" id="cameraBtn">
          <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <span>拍照</span>
        </button>
      </div>
      <p class="upload-error" id="uploadError" hidden></p>
    </section>

    <!-- ====== 图片查看器 ====== -->
    <section class="viewer-section" id="viewerSection" hidden>
      <div class="viewer-toolbar">
        <button class="btn btn-sm" id="resetBtn">🔄 重新上传</button>
        <button class="btn btn-sm" id="resetSelectionBtn">↩ 重置选框</button>
      </div>
      <!-- tabindex 让键盘用户能聚焦到选框区域并用方向键操作（见 REVIEW.md C3） -->
      <div class="viewer-wrapper" id="viewerWrapper" tabindex="0"
           aria-label="框选区域：用方向键移动选框，Shift 加方向键调整大小">
        <!-- 画布需要可访问名称：读屏用户听到的是"框选区域"，而不是无名的 canvas（见 REVIEW.md M4） -->
        <canvas id="viewerCanvas" role="img" aria-label="图片查看器"></canvas>
        <!-- 矩形选框覆盖层 -->
        <div class="selection-overlay" id="selectionOverlay">
          <div class="selection-box" id="selectionBox">    <!-- 用 class 控制显隐，不用 hidden 属性（iOS Safari 兼容） -->
            <!-- 8 个控制手柄 -->
            <div class="handle nw" data-handle="nw"></div>
            <div class="handle n" data-handle="n"></div>
            <div class="handle ne" data-handle="ne"></div>
            <div class="handle w" data-handle="w"></div>
            <div class="handle e" data-handle="e"></div>
            <div class="handle sw" data-handle="sw"></div>
            <div class="handle s" data-handle="s"></div>
            <div class="handle se" data-handle="se"></div>
          </div>
        </div>
      </div>
      <p class="viewer-hint" id="viewerHint">✨ 在图片上拖拽框选目标区域</p>
      <p class="viewer-hint" id="viewerHint2">🖱 滚轮缩放 · 右键拖拽平移</p>
      <p class="viewer-hint" id="viewerHint3" hidden>📱 双指缩放/平移</p>
      <!-- 键盘操作提示：仅对键盘用户可见（C3 的键盘通路，见 REVIEW.md C3） -->
      <p class="viewer-hint" id="viewerHint4">⌨ 方向键移动选框 · Shift+方向键调整大小</p>
    </section>

    <!-- ====== 控制栏 ====== -->
    <section class="controls-section" id="controlsSection" hidden>
      <div class="controls">
        <div class="control-group">
          <span class="control-label" id="gridSizeLabel">网格尺寸</span>
          <div class="grid-sizes" role="group" aria-labelledby="gridSizeLabel">
            <button class="grid-btn active" data-w="29" data-h="29" aria-pressed="true">29×29</button>
            <button class="grid-btn" data-w="52" data-h="52" aria-pressed="false">52×52</button>
            <button class="grid-btn" data-w="78" data-h="78" aria-pressed="false">78×78</button>
            <button class="grid-btn" data-w="104" data-h="104" aria-pressed="false">104×104</button>
          </div>
          <p class="aspect-hint">选框内容按比例自动居中放入豆板</p>
        </div>
        <div class="control-group custom-size">
          <span class="control-label" id="customSizeLabel">自定义</span>
          <div class="custom-inputs" role="group" aria-labelledby="customSizeLabel">
            <!-- placeholder 不是可访问名称（输入后即消失），必须补 aria-label（见 REVIEW.md m5） -->
            <input type="number" id="customW" min="15" max="104" placeholder="宽"
                   aria-label="自定义网格宽度（15 到 104）" class="custom-input">
            <span class="custom-x" aria-hidden="true">×</span>
            <input type="number" id="customH" min="15" max="104" placeholder="高"
                   aria-label="自定义网格高度（15 到 104）" class="custom-input">
            <button id="applyCustom" class="btn btn-sm">应用</button>
          </div>
        </div>
        <div class="control-group simplify-group">
          <label class="control-label" for="simplifySlider">颜色简化</label>
          <div class="simplify-control">
            <input type="range" id="simplifySlider" min="0" max="100" value="0"
                   aria-describedby="simplifyValue" aria-valuetext="关闭">
            <span class="simplify-value" id="simplifyValue">关闭</span>
          </div>
        </div>
        <!-- 行列标尺：52×52 以上靠肉眼数格子必错（PLAN §2.2 P0）。
             用 <label for> 关联，可访问名称即「行列标尺」——复选框自身表达开关状态，
             不需要再造 aria-valuetext（与简化滑块不同，它没有"读数"）。 -->
        <div class="control-group ruler-group">
          <label class="ruler-toggle" for="rulerToggle">
            <input type="checkbox" id="rulerToggle" checked>
            <span class="control-label">行列标尺</span>
          </label>
        </div>
        <div class="control-group">
          <button id="downloadBtn" class="btn btn-primary" disabled
                  aria-describedby="downloadHint">📥 下载 PNG</button>
          <!-- 禁用原因必须可被读屏取到：disabled 按钮不可聚焦，读屏拿不到原因（见 REVIEW.md M5） -->
          <span class="visually-hidden" id="downloadHint">请先上传图片并框选区域，生成图纸后即可下载</span>
          <button id="shareBtn" class="btn btn-share" hidden>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            分享
          </button>
        </div>
      </div>
    </section>

    <!-- ====== 图纸预览 ====== -->
    <section class="preview-section" id="previewSection" hidden>
      <h2 class="section-title">图纸预览</h2>
      <div class="preview-container">
        <!-- 预览是工具的唯一产出物，必须让读屏用户也能感知（见 REVIEW.md M4） -->
        <canvas id="previewCanvas" class="preview-canvas"
                role="img"
                aria-label="拼豆图纸预览"></canvas>
      </div>
      <p class="preview-info" id="previewInfo"></p>
    </section>

    <!-- ====== 颜色统计 ====== -->
    <section class="stats-section" id="statsSection" hidden>
      <h2 class="section-title">颜色统计</h2>
      <div class="stats-table-wrapper">
        <table class="stats-table">
          <thead>
            <tr>
              <th>颜色</th>
              <th>名称</th>
              <th>色号</th>
              <th>数量</th>
            </tr>
          </thead>
          <tbody id="statsBody"></tbody>
          <tfoot id="statsFoot"></tfoot>
        </table>
      </div>
    </section>

    <!-- ====== 加载提示 ====== -->
    <!-- aria-live：让读屏用户听到"正在生成/已生成"，而不是静默等待（见 REVIEW.md M5） -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner"></div>
      <p class="loading-text" id="loadingText" role="status" aria-live="polite">正在生成图纸…</p>
    </div>

    <!-- ====== 结果播报（读屏专用，视觉隐藏） ====== -->
    <!-- 生成完成、尺寸变化等状态由 JS 写入；不占视觉空间（见 REVIEW.md M5） -->
    <p class="visually-hidden" id="liveStatus" role="status" aria-live="polite"></p>

    <!-- ====== 全局提示条（与当前显示的分区无关，任何阶段都可见） ====== -->
    <div class="toast" id="toast" role="alert" aria-live="assertive" hidden></div>

    <!-- ====== 安装提示 ====== -->
    <div class="install-banner" id="installBanner" hidden>
      <span class="install-text">📌 将拼豆图纸添加到主屏幕，方便随时使用</span>
      <button class="install-btn" id="installBtn">添加</button>
      <button class="install-close" id="installClose" aria-label="关闭安装提示">✕</button>
    </div>

    <!-- ====== 隐藏画布用于像素采样 ====== -->
    <canvas id="offscreenCanvas" hidden></canvas>
    <!-- ====== 隐藏画布用于下载合成 ====== -->
    <canvas id="downloadCanvas" hidden></canvas>

  </main>

  <script src="color-palette.js"></script>
  <!-- ⚠️ 顺序即依赖，**层次不能颠倒**。裸 script 之间共享全局词法环境，
       顺序错了会抛 TDZ 错误（真实 Chrome 实测：`Cannot access '$' before initialization`）。
       层次：core（DOM 引用 / state）→ pipeline（绘制·简化·生成）
             → output（预览/统计/导出）→ ui（a11y）→ app.js（主逻辑与事件装配）
       此阶段刻意不用 type="module" —— 步骤 0 尚未执行。 -->
  <script src="js/core/dom.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/pipeline/render.js"></script>
  <script src="js/pipeline/simplify.js"></script>
  <script src="js/pipeline/grid.js"></script>
  <script src="js/viewer/viewer.js"></script>
  <script src="js/viewer/selection.js"></script>
  <script src="js/viewer/panzoom.js"></script>
  <script src="js/output/preview.js"></script>
  <script src="js/output/stats.js"></script>
  <script src="js/output/export.js"></script>
  <script src="js/ui/a11y.js"></script>
  <script src="app.js"></script>
  <script>
    // Service Worker 注册。
    // 失败时**不能在控制台完全静默** —— 否则"离线功能不生效"无从排查（见 REVIEW.md n4）。
    // 用户可见层面仍保持安静（不影响主流程），只在控制台留下可诊断的信息。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('[拼豆] Service Worker 注册失败，离线功能不可用：', err);
        });
      });
    }
  </script>
</body>
</html>
