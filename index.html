<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="拼豆图纸">
  <title>拼豆图纸生成器</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>拼豆图纸生成器</h1>
    <span class="subtitle">上传图片 → 框选区域 → 生成图纸</span>
  </header>

  <main class="main">

    <!-- ====== 上传区 ====== -->
    <section class="upload-section" id="uploadSection">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
        <div class="upload-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="upload-text">拖拽图片到此处，或 <strong>点击上传</strong></p>
        <p class="upload-hint">支持 JPG / PNG / WebP，最大 20MB</p>
        <button id="cameraBtn" class="btn btn-camera" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          拍照
        </button>
      </div>
      <p class="upload-error" id="uploadError" hidden></p>
    </section>

    <!-- ====== 图片查看器 ====== -->
    <section class="viewer-section" id="viewerSection" hidden>
      <div class="viewer-toolbar">
        <button class="btn btn-sm" id="resetBtn">🔄 重新上传</button>
      </div>
      <div class="viewer-wrapper" id="viewerWrapper">
        <canvas id="viewerCanvas"></canvas>
        <!-- 矩形选框覆盖层 -->
        <div class="selection-overlay" id="selectionOverlay">
          <div class="selection-box" id="selectionBox" hidden>
            <!-- 8 个控制手柄 -->
            <div class="handle nw" data-handle="nw"></div>
            <div class="handle n" data-handle="n"></div>
            <div class="handle ne" data-handle="ne"></div>
            <div class="handle w" data-handle="w"></div>
            <div class="handle e" data-handle="e"></div>
            <div class="handle sw" data-handle="sw"></div>
            <div class="handle s" data-handle="s"></div>
            <div class="handle se" data-handle="se"></div>
          </div>
        </div>
      </div>
      <p class="viewer-hint" id="viewerHint">✨ 在图片上拖拽框选目标区域</p>
      <p class="viewer-hint" id="viewerHint2">🖱 滚轮缩放 · 右键拖拽平移</p>
      <p class="viewer-hint" id="viewerHint3" hidden>📱 双指缩放/平移 · 选框外拖拽平移</p>
    </section>

    <!-- ====== 控制栏 ====== -->
    <section class="controls-section" id="controlsSection" hidden>
      <div class="controls">
        <div class="control-group">
          <label class="control-label">网格尺寸</label>
          <div class="grid-sizes">
            <button class="grid-btn active" data-w="29" data-h="29">29×29</button>
            <button class="grid-btn" data-w="52" data-h="52">52×52</button>
            <button class="grid-btn" data-w="78" data-h="78">78×78</button>
            <button class="grid-btn" data-w="104" data-h="104">104×104</button>
          </div>
          <label class="aspect-lock-label">
            <input type="checkbox" id="aspectLock" checked> 保持选框比例
          </label>
        </div>
        <div class="control-group custom-size">
          <label class="control-label">自定义</label>
          <div class="custom-inputs">
            <input type="number" id="customW" min="15" max="104" placeholder="宽" class="custom-input">
            <span class="custom-x">×</span>
            <input type="number" id="customH" min="15" max="104" placeholder="高" class="custom-input">
            <button id="applyCustom" class="btn btn-sm">应用</button>
          </div>
        </div>
        <div class="control-group">
          <label class="control-label">颜色简化</label>
          <div class="simplify-control">
            <input type="range" id="simplifySlider" min="0" max="100" value="0">
            <span class="simplify-value" id="simplifyValue">关闭</span>
          </div>
        </div>
        <div class="control-group">
          <button id="downloadBtn" class="btn btn-primary" disabled>📥 下载 PNG</button>
          <button id="shareBtn" class="btn btn-share" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            分享
          </button>
        </div>
      </div>
    </section>

    <!-- ====== 图纸预览 ====== -->
    <section class="preview-section" id="previewSection" hidden>
      <h2 class="section-title">图纸预览</h2>
      <div class="preview-container">
        <canvas id="previewCanvas" class="preview-canvas"></canvas>
      </div>
      <p class="preview-info" id="previewInfo"></p>
    </section>

    <!-- ====== 颜色统计 ====== -->
    <section class="stats-section" id="statsSection" hidden>
      <h2 class="section-title">颜色统计</h2>
      <div class="stats-table-wrapper">
        <table class="stats-table">
          <thead>
            <tr>
              <th>颜色</th>
              <th>名称</th>
              <th>色号</th>
              <th>数量</th>
            </tr>
          </thead>
          <tbody id="statsBody"></tbody>
          <tfoot id="statsFoot"></tfoot>
        </table>
      </div>
    </section>

    <!-- ====== 加载提示 ====== -->
    <div class="loading-overlay" id="loadingOverlay" hidden>
      <div class="loading-spinner"></div>
      <p class="loading-text" id="loadingText">正在生成图纸…</p>
    </div>

    <!-- ====== 安装提示 ====== -->
    <div class="install-banner" id="installBanner" hidden>
      <span class="install-text">📌 将拼豆图纸添加到主屏幕，方便随时使用</span>
      <button class="install-btn" id="installBtn">添加</button>
      <button class="install-close" id="installClose">✕</button>
    </div>

    <!-- ====== 隐藏画布用于像素采样 ====== -->
    <canvas id="offscreenCanvas" hidden></canvas>
    <!-- ====== 隐藏画布用于下载合成 ====== -->
    <canvas id="downloadCanvas" hidden></canvas>

  </main>

  <script src="color-palette.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
